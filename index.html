<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Life Value Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eef7ff;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result h2 {
            margin: 0 0 10px;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }

        .error {
            color: red;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Human Life Value Calculator</h1>

    <label for="income">Annual Income (₹)</label>
    <input type="number" id="income" placeholder="e.g. 600000">

    <label for="expenses">Annual Personal Expenses (₹)</label>
    <input type="number" id="expenses" placeholder="e.g. 150000">

    <label for="years">Years of Working Life Remaining</label>
    <input type="number" id="years" placeholder="e.g. 25">

    <label for="rate">Expected Investment Return (%)</label>
    <input type="number" id="rate" value="8" step="0.1">

    <button onclick="calculateHLV()">Calculate HLV</button>

    <div class="result" id="result">
        <h2>Estimated Human Life Value</h2>
        <div class="amount" id="hlv"></div>
    </div>

    <div class="error" id="error"></div>

</div>

<script>
function calculateHLV() {

    const income = parseFloat(document.getElementById("income").value);
    const expenses = parseFloat(document.getElementById("expenses").value);
    const years = parseFloat(document.getElementById("years").value);
    const rate = parseFloat(document.getElementById("rate").value);

    const result = document.getElementById("result");
    const error = document.getElementById("error");

    error.textContent = "";
    result.style.display = "none";

    if (
        isNaN(income) ||
        isNaN(expenses) ||
        isNaN(years) ||
        isNaN(rate)
    ) {
        error.textContent = "Please enter all values.";
        return;
    }

    if (income <= expenses) {
        error.textContent =
            "Annual income must be greater than annual personal expenses.";
        return;
    }

    if (years <= 0 || rate < 0) {
        error.textContent = "Please enter valid values.";
        return;
    }

    // Annual contribution available to the family
    const annualContribution = income - expenses;

    // Convert percentage to decimal
    const r = rate / 100;

    let hlv;

    // Present Value of an annuity
    if (r === 0) {
        hlv = annualContribution * years;
    } else {
        hlv =
            annualContribution *
            ((1 - Math.pow(1 + r, -years)) / r);
    }

    document.getElementById("hlv").textContent =
        "₹" + hlv.toLocaleString("en-IN", {
            maximumFractionDigits: 0
        });

    result.style.display = "block";
}
</script>

</body>
</html>
